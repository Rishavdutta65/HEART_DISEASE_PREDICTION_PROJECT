<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    
    <!-- Heart Gradient -->
    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- AI Circuit Gradient -->
    <linearGradient id="circuit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <!-- Glow Effect for ECG -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg-gradient)" />

  <!-- Shield/Hexagon Base (Optional - kept subtle) -->
  <polygon points="256,40 460,110 460,340 256,470 52,340 52,110" fill="rgba(15, 23, 42, 0.4)" stroke="#1e293b" stroke-width="4"/>

  <!-- The Heart Shape -->
  <path d="M256,420 
           C256,420 100,290 100,180 
           C100,110 160,70 210,70 
           C240,70 256,90 256,90 
           C256,90 272,70 302,70 
           C352,70 412,110 412,180 
           C412,290 256,420 256,420 Z" 
        fill="rgba(15,23,42,0.8)" stroke="url(#heart-grad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- AI Circuit / Neural Net inside the Heart -->
  <g stroke="url(#circuit-grad)" stroke-width="4" fill="none" opacity="0.8">
    <!-- Lines connecting nodes -->
    <path d="M256,120 L200,180 L256,260 L312,180 Z" />
    <path d="M200,180 L140,220 L256,330" />
    <path d="M312,180 L372,220 L256,330" />
    <path d="M256,260 L256,330" />
    <path d="M256,120 L256,90" />
  </g>

  <!-- Neural Net Nodes -->
  <g fill="#22d3ee">
    <circle cx="256" cy="120" r="8" />
    <circle cx="200" cy="180" r="10" />
    <circle cx="312" cy="180" r="10" />
    <circle cx="140" cy="220" r="8" />
    <circle cx="372" cy="220" r="8" />
    <circle cx="256" cy="260" r="12" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="256" cy="330" r="8" />
  </g>

  <!-- ECG Pulse Line cutting across -->
  <path d="M40,280 L140,280 L170,220 L220,380 L260,140 L300,320 L330,280 L472,280" 
        fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

</svg>
